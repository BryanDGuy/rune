syntax = "proto3";

package rune.v1;

option go_package = "github.com/bryandguy/rune/gen/rune/v1;runev1";

// RuneService is a large-blob cache optimized for values 1MB and above.
service RuneService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc Get(GetRequest) returns (stream GetResponse);
  rpc Set(stream SetRequest) returns (SetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Exists(ExistsRequest) returns (ExistsResponse);
  rpc Info(InfoRequest) returns (InfoResponse);
}

message PingRequest {}
message PingResponse { string message = 1; }

message GetRequest { string key = 1; }
message GetResponse { bytes chunk = 1; }

message SetRequest {
  oneof payload {
    SetHeader header = 1;
    bytes chunk = 2;
  }
}
message SetHeader {
  string key = 1;
  int64 ttl_seconds = 2;
}
message SetResponse {}

message DeleteRequest { repeated string keys = 1; }
message DeleteResponse {}

message ExistsRequest { repeated string keys = 1; }
message ExistsResponse { int64 count = 1; }

message InfoRequest {}
message InfoResponse {
  int64 storage_used_bytes = 1;
  int64 storage_max_bytes = 2;
  int64 cache_hits = 3;
  int64 cache_misses = 4;
  int64 active_connections = 5;
  int64 evictions_total = 6;
}
