name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - run: make fmt-check

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - run: make vet

  modernize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - run: make modernize

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: ./rune/... ./sdk/go/...

  test:
    runs-on: ubuntu-latest
    needs: [fmt, vet, modernize, lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - run: make test

  test-integration:
    runs-on: ubuntu-latest
    needs: [fmt, vet, modernize, lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - run: make test-integration

  # Release only after every CI job passed for this exact commit (github.sha).
  # Any new CI job must be added to needs (directly or via test/test-integration), or it will not gate the release.
  release:
    needs: [test, test-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: release-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cycjimmy/semantic-release-action@v8
        id: semantic
        with:
          semantic_version: 25.0.2 # stale-push guard verified in this version; plugins come from its own deps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: release
    if: needs.release.outputs.published == 'true'
    # shortcut: one pending job per group, so with 3+ quick releases a middle version gets no image (latest stays right); add a queue if that matters.
    concurrency:
      group: docker-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/rune
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: rune/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
